[package]
name = "tidecoin-network-kind"
version = "0.1.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
description = "Which network we are operating on"
categories = ["cryptography::cryptocurrencies"]
keywords = ["tidecoin", "types"]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["alloc", "internals/std"]
alloc = ["internals/alloc", "serde?/alloc"]

[dependencies]
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0", default-features = false }

arbitrary = { version = "1.4.1", optional = true }
serde = { version = "1.0.195", default-features = false, features = [ "derive" ], optional = true }

[dev-dependencies]
serde_json = "1.0.68"
serde_test = "1.0.19"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
