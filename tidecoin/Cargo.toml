[package]
name = "tidecoin"
version = "0.33.0-beta"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin/"
documentation = "https://docs.rs/tidecoin/"
description = "General purpose library for using and interoperating with Tidecoin."
categories = ["cryptography::cryptocurrencies"]
keywords = [ "crypto", "tidecoin" ]
readme = "../README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

# If you change features or optional dependencies in any way please update the "# Cargo features" section in lib.rs as well.
[features]
default = [ "std", "rand", "p2p", "pow" ]
std = ["base58/std", "bech32/std", "consensus_core/std", "encoding/std", "hashes/std", "hex-stable/std", "internals/std", "io/std", "network/std", "primitives/std", "units/std"]
# Internal parity/test feature. Keep product validation on the pure-Rust path.
tidecoin-node-validation = ["std", "rand", "dep:node_parity"]
rand = ["rand_core/getrandom"]
serde = ["dep:serde", "consensus_core/serde", "hashes/serde", "internals/serde", "network/serde", "primitives/serde", "units/serde"]
arbitrary = ["dep:arbitrary", "units/arbitrary", "primitives/arbitrary", "hashes/arbitrary", "network/arbitrary"]
p2p = ["dep:p2p_messages"]
pow = ["dep:scrypt", "dep:rust-yespower"]

[dependencies]
base58 = { package = "tidecoin-base58ck", path = "../base58", version = "0.4.0", default-features = false, features = ["alloc"] }
bech32 = { version = "0.11.0", default-features = false, features = ["alloc"] }
consensus_core = { package = "tidecoin-consensus-core", path = "../consensus-core", version = "0.1.0", default-features = false, features = ["hex"] }
hashes = { package = "tidecoin_hashes", path = "../hashes", version = "0.20.0", default-features = false, features = ["alloc", "hex"] }
encoding = { package = "tidecoin-consensus-encoding", path = "../consensus_encoding", version = "0.1.0", default-features = false, features = ["alloc"] }
hex-stable = { package = "hex-conservative", version = "1.0.0", default-features = false, features = ["alloc"] }
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0", default-features = false, features = ["alloc", "hex"] }
io = { package = "tidecoin-io", path = "../io", version = "0.5.0", default-features = false, features = ["alloc", "hashes"] }
network = { package = "tidecoin-network-kind", path = "../network", version = "0.1.0", default-features = false, features = ["alloc"]}
p2p_messages = { package = "tidecoin-p2p-messages", path = "../p2p", version = "0.1.0", default-features = false, optional = true }
primitives = { package = "tidecoin-primitives", path = "../primitives", version = "0.102.0", default-features = false, features = ["alloc", "hex"] }
units = { package = "tidecoin-units", path = "../units", version = "0.3.0", default-features = false, features = ["alloc"] }
node_parity = { package = "tidecoin-node-parity", path = "../node-parity", version = "0.1.0", optional = true }
tide-fn-dsa-kgen = { version = "0.4.0", default-features = false }
tide-fn-dsa-sign = { version = "0.4.0", default-features = false }
rand_core = { version = "0.6", default-features = false }
scrypt = { version = "0.11", default-features = false, optional = true }
rust-yespower = { version = "0.2.0", default-features = false, optional = true }
ml-kem = { version = "0.3.0-rc.2", default-features = false, features = ["zeroize"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

arbitrary = { version = "1.4.1", optional = true }
serde = { version = "1.0.195", default-features = false, features = [ "derive", "alloc" ], optional = true }

[dev-dependencies]
internals = { package = "tidecoin-internals", path = "../internals", default-features = false, features = ["test-serde"] }
serde_json = "1.0.68"
serde_test = "1.0.19"
bincode = "1.3.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "io"
required-features = ["std"]

[[example]]
name = "script"
required-features = ["std"]

[[example]]
name = "serde"
required-features = ["std", "serde"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)', 'cfg(kani)'] }

[lints.clippy]
redundant_clone = "warn"
use_self = "warn"

[package.metadata.rbmt.test]
examples = [
    "serde:std serde",
]
exact_features = [
    ["std", "serde"],
]

[package.metadata.rbmt.prerelease]
enabled = true
