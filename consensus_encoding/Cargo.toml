[package]
name = "tidecoin-consensus-encoding"
version = "0.1.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
homepage = "https://github.com/tidecoin/rust-tidecoin"
documentation = "https://docs.rs/tidecoin-consensus-encoding/"
repository = "https://github.com/tidecoin/rust-tidecoin"
description = "Consensus encoding and decoding"
categories = ["cryptography::cryptocurrencies"]
keywords = ["tidecoin", "no-std"]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["alloc", "internals/std"]
alloc = ["internals/alloc"]

[dependencies]
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0" }

[dev-dependencies]
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0", features = ["hex"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "encoder"
required-features = ["alloc"]

[lints]
workspace = true

[package.metadata.rbmt.test]
examples = ["encoder:alloc"]

[package.metadata.rbmt.prerelease]
enabled = true
