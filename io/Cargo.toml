[package]
name = "tidecoin-io"
version = "0.5.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
documentation = "https://docs.rs/tidecoin-io/"
description = "Simple I/O traits for no-std (and std) environments"
categories = ["no-std"]
keywords = [ "io", "no-std" ]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["alloc", "encoding/std", "hashes?/std", "internals/std"]
alloc = ["encoding/alloc", "hashes?/alloc", "internals/alloc"]

[dependencies]
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0" }
encoding = { package = "tidecoin-consensus-encoding", path = "../consensus_encoding", version = "0.1.0", default-features = false }

hashes = { package = "tidecoin_hashes", path = "../hashes", version = "0.20.0", default-features = false, optional = true }

[dev-dependencies]
hashes = { package = "tidecoin_hashes", path = "../hashes", version = "0.20.0", default-features = false, features = ["hex"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.rbmt.test]
exact_features = [
    ["alloc", "hashes"],
    ["std", "hashes"],
]
