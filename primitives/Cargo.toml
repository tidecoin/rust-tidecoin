[package]
name = "tidecoin-primitives"
version = "0.103.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
description = "Primitive types used by the rust-tidecoin ecosystem"
categories = ["cryptography::cryptocurrencies", "no-std"]
keywords = ["tidecoin", "types"]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std", "hex"]
std = ["alloc", "hashes/std", "hex-stable?/std", "internals/std", "units/std"]
alloc = ["hashes/alloc", "hex-stable?/alloc", "internals/alloc", "units/alloc"]
serde = ["dep:serde", "hashes/serde", "internals/serde", "units/serde", "alloc", "hex"]
arbitrary = ["dep:arbitrary", "units/arbitrary"]
hex = ["dep:hex-stable", "hashes/hex", "internals/hex"]

[dependencies]
encoding = { package = "tidecoin-consensus-encoding", path = "../consensus_encoding", version = "0.1.1", default-features = false }
hashes = { package = "tidecoin_hashes", path = "../hashes", version = "0.21.0", default-features = false }
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.1", default-features = false }
units = { package = "tidecoin-units", path = "../units", version = "0.3.1", default-features = false, features = [ "encoding" ] }

arbitrary = { version = "1.4.1", optional = true }
serde = { version = "1.0.195", default-features = false, features = ["derive", "alloc"], optional = true }
hex-stable = { package = "hex-conservative", version = "1.0.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.68"
bincode = "1.3.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.rbmt.test]
exact_features = [
    ["alloc", "hex"],
    ["alloc", "serde"],
    ["hex", "serde"],
    ["std", "hex"],
    ["std", "serde"],
    ["alloc", "hex", "serde"],
    ["std", "hex", "serde"],
]

[package.metadata.rbmt.prerelease]
enabled = true
