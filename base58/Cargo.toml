[package]
name = "tidecoin-base58ck"
version = "0.4.1"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
description = "Tidecoin base58 encoding with checksum."
categories = ["cryptography::cryptocurrencies", "encoding"]
keywords = ["tidecoin", "base58", "encode", "decode", "checksum"]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["alloc", "hashes/std", "internals/std"]
alloc = ["hashes/alloc", "internals/alloc"]

[dependencies]
hashes = { package = "tidecoin_hashes", path = "../hashes", version = "0.21.0", default-features = false }
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.1", default-features = false }

[dev-dependencies]
hex = { package = "hex-conservative", version = "1.0.0", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
