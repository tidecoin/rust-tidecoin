---   # rust-tidecoin CI: If you edit this file please update README.md
on:   # yamllint disable-line rule:truthy
  push:
    branches:
      - v2
      - main
      - 'test-ci/**'
  pull_request:

name: Continuous integration

permissions: {}

jobs:
  NodeParity:
    name: Required rc3 node parity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TIDECOIN_NODE_REPO: ${{ github.workspace }}/reference-node
      TIDECOIN_NODE_PARITY_REQUIRED: '1'
      TIDECOIN_NODE_VALIDATION_ORACLE: ${{ github.workspace }}/target/node-oracle/tidecoin-validation-oracle
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read authoritative node revision
        id: node
        run: echo "revision=$(cat node-parity/NODE_REVISION)" >> "$GITHUB_OUTPUT"
      - name: Read stable Rust version
        id: rust
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["rbmt"]["toolchains"]["stable"])')" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned C++ node
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: tidecoin/tidecoin
          ref: ${{ steps.node.outputs.revision }}
          path: reference-node
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy
      - name: Install node oracle build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libboost-dev libevent-dev
      - name: Build original node validation oracle
        run: |
          cmake -S node-parity/validation-oracle -B target/node-oracle \
            -DTIDECOIN_NODE_REPO="$TIDECOIN_NODE_REPO" -DCMAKE_BUILD_TYPE=Release
          cmake --build target/node-oracle --target tidecoin-validation-oracle -j 2
      # A fresh runner builds the oracle directly from the pinned node sources.
      - name: Workspace and node differential tests
        run: cargo test --workspace --all-targets
      - name: Product API node differential tests
        run: cargo test -p tidecoin --lib --tests --features tidecoin-node-validation
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: No-default-features workspace
        run: cargo check --workspace --no-default-features
      - name: Independent no-std libraries
        run: |
          for package in consensus tidecoin-consensus-core tidecoin-consensus-encoding tidecoin-primitives tidecoin-p2p-messages tidecoin; do
            cargo check -p "$package" --no-default-features
          done
          cargo check -p tidecoin-p2p-messages --no-default-features --features serde
          cargo check -p tidecoin-p2p-messages --features serde

  Test:
    name: Test - ${{ matrix.toolchain }} toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly, msrv]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: rust-bitcoin/rust-bitcoin-maintainer-tools/.github/actions/setup-rbmt@64715bab0d6fa1f3ebd6f9be336c4c5089bb5eb9
      - name: "Run tests"
        run: |
          cargo generate-lockfile
          cargo rbmt --lock-file existing test --toolchain ${{ matrix.toolchain }}

  Check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [lint, docs, docsrs, bench]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: rust-bitcoin/rust-bitcoin-maintainer-tools/.github/actions/setup-rbmt@64715bab0d6fa1f3ebd6f9be336c4c5089bb5eb9
      - name: "Run ${{ matrix.task }}"
        run: |
          cargo generate-lockfile
          cargo rbmt --lock-file existing ${{ matrix.task }}

  Format:
    name: Format - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Read stable Rust version
        id: rust
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["rbmt"]["toolchains"]["stable"])')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  Prerelease:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # History required for version bump detection.
      # fetch-depth: 0 already fetched all branches, including the base ref.
      # Do not fetch again after checkout removes its temporary credentials.
      - uses: rust-bitcoin/rust-bitcoin-maintainer-tools/.github/actions/setup-rbmt@64715bab0d6fa1f3ebd6f9be336c4c5089bb5eb9
      - name: "Run pre-release checks"
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: cargo rbmt prerelease --baseline "origin/$BASE_BRANCH"

  # Non cargo-rbmt jobs manage their toolchain version directly.
  Prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nightly_version: ${{ steps.read_toolchain.outputs.nightly_version }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Read workspace versions"
        id: read_toolchain
        run: echo "nightly_version=$(cargo metadata --format-version 1 | jq -r '.metadata.rbmt.toolchains.nightly')" >> $GITHUB_OUTPUT

  Arch32bit:
    name: Test 32-bit version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
      - name: "Add architecture i386 and install dependencies"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32stdc++-13-dev
      - name: "Install i686 gcc"
        run: sudo apt-get update -y && sudo apt-get install -y gcc-multilib
      - name: "Install target"
        run: rustup target add i686-unknown-linux-gnu
      - name: "Run test on i686"
        run: cargo test --target i686-unknown-linux-gnu

  Cross:
    name: Cross test - stable toolchain
    if: ${{ !github.event.act }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - s390x-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
      - name: "Install target"
        run: rustup target add ${{ matrix.target }}
      - name: "Install cross"
        run: cargo install cross --locked
      - name: "Run cross test"
        run: cross test --target ${{ matrix.target }}

  Embedded:
    name: Embedded - nightly toolchain
    needs: Prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RUSTFLAGS: "-C link-arg=-Tlink.x"
      CARGO_TARGET_THUMBV7M_NONE_EABI_RUNNER: "qemu-system-arm -cpu cortex-m3 -machine mps2-an385 -nographic -semihosting-config enable=on,target=native -kernel"
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Set up QEMU"
        run: sudo apt update && sudo apt install -y qemu-system-arm gcc-arm-none-eabi
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ needs.Prepare.outputs.nightly_version }}
          targets: thumbv7m-none-eabi
      - name: "Install rust-src"
        run: rustup component add rust-src
      - name: "Run hashes/embedded no alloc"
        run: cd hashes/embedded && cargo run --target thumbv7m-none-eabi
      - name: "Run hashes/embedded with alloc and no hex"
        run: cd hashes/embedded && cargo run --target thumbv7m-none-eabi --features=alloc
      - name: "Run hashes/embedded with alloc and hex"
        run: cd hashes/embedded && cargo run --target thumbv7m-none-eabi --features=alloc,hex

  ASAN:                         # hashes crate only.
    name: ASAN - nightly toolchain
    needs: Prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ needs.Prepare.outputs.nightly_version }}
      - name: "Install rust-src"
        run: rustup component add rust-src
      - name: "Run sanitizer script"
        run: cd ./hashes && ./contrib/sanitizer.sh

  WASM:                         # hashes crate only.
    name: WASM - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
      - name: "Run wasm script"
        run: cd hashes && ./contrib/wasm.sh

  Kani:
    name: Kani codegen - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Build Kani proofs"
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: "--only-codegen"

  Policy:
    name: Enforce repo policy - stable toolchain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
      - name: "Run policy script"
        run: ./contrib/check-for-policy-violations.sh

  DiffMutants:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: Check cargo mutants in diff - stable toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # required for full diff context
      - name: "Select toolchain"
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
      - name: "Retrieve relative diff"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: git diff "origin/$BASE_BRANCH...HEAD" -- '*.rs' | tee git.diff
      - uses: taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-mutants
      - run: cargo mutants --no-shuffle --in-diff git.diff
