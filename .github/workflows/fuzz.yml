# Automatically generated by fuzz/generate-files.sh
name: Fuzz
on:
  # Manual only: run from the Actions tab when wanted.
  workflow_dispatch:
permissions: {}

jobs:
  fuzz:
    if: ${{ !github.event.act }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One job per fuzz target, each running fuzz/fuzz.sh (100,000 inputs).
        fuzz_target: [
          consensus_encoding_decode_array,
          consensus_encoding_decode_byte_vec,
          consensus_encoding_decode_compact_size,
          consensus_encoding_decode_decoder2,
          consensus_script_runtime,
          hashes_json,
          hashes_ripemd160,
          hashes_sha1,
          hashes_sha256,
          hashes_sha512,
          hashes_sha512_256,
          p2p_arbitrary_addrv2,
          p2p_deserialize_addrv2,
          p2p_deserialize_raw_net_msg,
          tidecoin_arbitrary_block,
          tidecoin_arbitrary_script,
          tidecoin_arbitrary_transaction,
          tidecoin_arbitrary_witness,
          tidecoin_block_sanity,
          tidecoin_deserialize_block,
          tidecoin_deserialize_prefilled_transaction,
          tidecoin_deserialize_script,
          tidecoin_deserialize_transaction,
          tidecoin_deserialize_witness,
          tidecoin_parse_address,
          tidecoin_parse_outpoint,
          tidecoin_pow,
          tidecoin_script_bytes_to_asm_fmt,
          tidecoin_script_policy,
          tidecoin_transaction_policy,
          tidecoin_tx_out_policy,
          units_arbitrary_weight,
          units_parse_amount,
          units_parse_int,
          units_standard_checks,
        ]
    steps:
      - name: Install test dependencies
        run: sudo apt-get update -y && sudo apt-get install -y binutils-dev libunwind8-dev libcurl4-openssl-dev libelf-dev libdw-dev cmake gcc libiberty-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-fuzz
        with:
          path: |
            ~/.cargo/bin
            fuzz/target
            target
          key: cache-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml','**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: '1.94.1'
      - name: fuzz
        run: |
          if [[ "${{ matrix.fuzz_target }}" =~ ^tidecoin ]]; then
              export RUSTFLAGS='--cfg=hashes_fuzz'
          fi
          echo "Using RUSTFLAGS $RUSTFLAGS"
          cd fuzz && ./fuzz.sh "${{ matrix.fuzz_target }}"
      - run: echo "${{ matrix.fuzz_target }}" >executed_${{ matrix.fuzz_target }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: executed_${{ matrix.fuzz_target }}
          path: executed_${{ matrix.fuzz_target }}

  verify-execution:
    if: ${{ !github.event.act }}
    needs: fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      - name: Display structure of downloaded files
        run: ls -R
      - run: find executed_* -type f -exec cat {} + | sort > executed
      - run: cargo fuzz list | grep -v "^consensus_node_differential$" | sort | diff - executed
