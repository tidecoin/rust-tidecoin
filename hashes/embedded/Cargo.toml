[package]
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
edition = "2021"
rust-version = "1.94.1"
readme = "README.md"
name = "embedded"
version = "0.1.0"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[features]
alloc = ["alloc-cortex-m", "tidecoin_hashes/alloc"]
hex = ["tidecoin_hashes/hex"]

[dependencies]
cortex-m-rt = "0.6.10"
cortex-m-semihosting = "0.3.3"
panic-halt = "0.2.0"
alloc-cortex-m = { version = "0.4.1", optional = true }
tidecoin_hashes = { path="../", default-features = false, features = [] }
tidecoin-io = { path = "../../io", default-features = false, features = ["hashes"] }

[lints.clippy]
use_self = "warn"

[[bin]]
name = "embedded"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations

[patch.crates-io.tidecoin_hashes]
path = "../../hashes"
