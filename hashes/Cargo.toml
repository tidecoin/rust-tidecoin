[package]
name = "tidecoin_hashes"
version = "0.20.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
documentation = "https://docs.rs/tidecoin_hashes/"
description = "Hash functions used by the rust-tidecoin ecosystem"
categories = ["algorithms", "cryptography", "no-std"]
keywords = [ "crypto", "tidecoin", "hash", "digest" ]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["alloc", "hex-stable?/std", "internals/std"]
alloc = ["hex-stable?/alloc", "internals/alloc"]
serde = ["dep:serde", "hex"]
hex = ["dep:hex-stable", "internals/hex"]
# Smaller (but slower) implementation of sha256, sha512 and ripemd160
small-hash = []

[dependencies]
zeroize = { version = "1.8", default-features = false }
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.0", default-features = false }
encoding = { package = "tidecoin-consensus-encoding", path = "../consensus_encoding", version = "0.1.0", default-features = false }

arbitrary = { version = "1.4.1", optional = true}
serde = { version = "1.0.195", default-features = false, optional = true }
cpufeatures = { version = "0.2", optional = true }

hex-stable = { package = "hex-conservative", version = "1.0.0", default-features = false, optional = true }

[dev-dependencies]
serde_test = "1.0.19"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.rbmt.test]
exact_features = [
    ["alloc", "serde"],
    ["alloc", "small-hash"],
    ["serde", "small-hash"],
    ["std", "serde"],
    ["std", "small-hash"],
    ["alloc", "serde", "small-hash"],
    ["std", "serde", "small-hash"],
]

[package.metadata.rbmt.prerelease]
enabled = true
