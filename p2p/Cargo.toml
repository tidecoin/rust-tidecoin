[package]
name = "tidecoin-p2p-messages"
version = "0.2.0"
authors = ["Tidecoin Foundation <falcon1024@protonmail.com>"]
license = "CC0-1.0"
repository = "https://github.com/tidecoin/rust-tidecoin"
description = "Peer-to-peer messages defined by the Tidecoin protocol"
categories = ["cryptography::cryptocurrencies"]
keywords = ["tidecoin", "peer-to-peer"]
readme = "README.md"
edition = "2021"
rust-version = "1.94.1"
# Unit tests in src/ include these data files; exclude only integration-test sources.
exclude = ["tests/*.rs", "contrib"]

[features]
default = ["std"]
std = ["encoding/std", "hashes/std", "network/std", "hex-stable/std", "internals/std", "io/std", "units/std", "primitives/std"]
arbitrary = ["dep:arbitrary", "primitives/arbitrary"]
serde = ["dep:serde", "hashes/serde", "primitives/serde"]

[dependencies]
chacha20-poly1305 = { package = "tidecoin-chacha20-poly1305", path = "../chacha20_poly1305", version = "0.1.3", default-features = false, features = ["alloc"] }
encoding = { package = "tidecoin-consensus-encoding", version = "0.1.1", path = "../consensus_encoding", default-features = false, features = ["alloc"] }
hashes = { package = "tidecoin_hashes", version = "0.21.0", path = "../hashes", default-features = false, features = ["hex"] }
network = { package = "tidecoin-network-kind", path = "../network", version = "0.1.1", default-features = false }
primitives = { package = "tidecoin-primitives", path = "../primitives", version = "0.103.0", default-features = false, features = ["alloc", "hex"] }
hex-stable = { package = "hex-conservative", version = "1.0.0", default-features = false, features = ["alloc"] }
internals = { package = "tidecoin-internals", path = "../internals", version = "0.5.1", default-features = false, features = ["hex"] }
io = { package = "tidecoin-io", version = "0.6.0", path = "../io", default-features = false }
units = { package = "tidecoin-units", path = "../units", version = "0.3.1", default-features = false }
zeroize = { version = "1.8", default-features = false }

arbitrary = { version = "1.4.1", optional = true }
serde = { version = "1.0.195", default-features = false, features = ["derive", "alloc"], optional = true }

[[example]]
name = "handshake"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.rbmt.test]
exact_features = [
    [],
    ["serde"],
    ["std", "serde"],
]
