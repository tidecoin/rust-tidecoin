[package]
name = "tidecoin-p2p-messages"
version = "0.1.0"
authors = ["Andrew Poelstra <apoelstra@wpsoftware.net>"]
license = "CC0-1.0"
repository = "https://github.com/nicenemo/rust-tidecoin"
description = "Peer-to-peer messages defined by the Tidecoin protocol"
categories = ["cryptography::cryptocurrencies"]
keywords = ["tidecoin", "peer-to-peer"]
readme = "README.md"
edition = "2021"
rust-version = "1.74.0"
exclude = ["tests", "contrib"]

[features]
default = ["std"]
std = ["encoding/std", "hashes/std", "network/std", "hex-stable/std", "hex-unstable/std", "internals/std", "io/std", "units/std", "bitcoin/std", "primitives/std"]
arbitrary = ["dep:arbitrary", "bitcoin/arbitrary"]
serde = ["dep:serde", "hashes/serde"]

[dependencies]
bitcoin = { path = "../bitcoin/", package = "tidecoin", default-features = false }
encoding = { package = "tidecoin-consensus-encoding", version = "0.1.0", path = "../consensus_encoding", default-features = false }
hashes = { package = "tidecoin_hashes", version = "0.20.0", path = "../hashes", default-features = false }
network = { package = "tidecoin-network-kind", path = "../network", version = "0.1.0", default-features = false }
primitives = { package = "tidecoin-primitives", path = "../primitives", version = "0.102.0", default-features = false }
hex-stable = { package = "hex-conservative", version = "1.0.0", default-features = false, features = ["alloc"] }
hex-unstable = { package = "hex-conservative", version = "0.3.2", default-features = false }
internals = { package = "tidecoin-internals", path = "../internals", default-features = false }
io = { package = "tidecoin-io", version = "0.5.0", path = "../io", default-features = false }
units = { package = "tidecoin-units", path = "../units", version = "0.3.0", default-features = false }

arbitrary = { version = "1.4.1", optional = true }
serde = { version = "1.0.195", default-features = false, features = ["derive", "alloc"], optional = true }

[[example]]
name = "handshake"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.rbmt.test]
exact_features = [
    ["std", "serde"],
]

[package.metadata.rbmt.lint]
allowed_duplicates = [
    "hex-conservative",
]
